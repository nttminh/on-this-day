<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${event.title() != null ? event.title() : 'Event'} + ' · On This Day'">Event · On This Day</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand__mark">📅</span>
        <span class="brand__name">On This Day</span>
    </a>
    <nav class="datenav">
        <a class="datenav__label datenav__label--link"
           th:href="@{'/date/' + ${event.month()} + '/' + ${event.day()}}"
           th:text="${dateLabel}">August 26</a>
    </nav>
    <a class="topbar__api" th:href="@{/swagger-ui.html}" target="_blank" rel="noopener">API</a>
</header>

<article class="detail">
    <div class="detail__hero" th:classappend="'tile--' + ${#strings.toLowerCase(event.feedType())}">
        <img th:if="${event.imageUrl() != null or event.thumbnailUrl() != null}"
             th:src="${event.imageUrl() != null ? event.imageUrl() : event.thumbnailUrl()}"
             th:alt="${event.title()}"/>
        <div class="detail__herotext">
            <span class="detail__year" th:if="${event.year() != null}" th:text="${event.year()}">1969</span>
            <span class="detail__feed" th:text="${#strings.toLowerCase(event.feedType())}">events</span>
        </div>
    </div>

    <div class="detail__body">
        <h1 class="detail__headline" th:text="${event.text()}">What happened.</h1>
        <p class="detail__extract" th:if="${event.extract() != null}" th:text="${event.extract()}">Summary…</p>

        <div class="detail__tags">
            <a class="minichip minichip--link" th:each="tag : ${event.tags()}"
               th:text="${tag}"
               th:href="@{'/date/' + ${event.month()} + '/' + ${event.day()}(tag=${tag})}">tag</a>
        </div>

        <div class="detail__actions">
            <a class="btn btn--primary" th:if="${event.wikipediaUrl() != null}"
               th:href="${event.wikipediaUrl()}" target="_blank" rel="noopener">Read on Wikipedia ↗</a>
            <button class="btn" type="button" data-share
                    th:attr="data-title=${event.title()}">Share</button>
            <a class="btn" th:href="@{'/date/' + ${event.month()} + '/' + ${event.day()}}">Back to <span th:text="${dateLabel}">the day</span></a>
        </div>
    </div>
</article>

<!-- More from this year -->
<section class="related" th:if="${!related.fromSameYear().isEmpty()}">
    <h2 class="related__title">More from <span th:text="${event.year()}">1969</span></h2>
    <div class="grid grid--related">
        <a th:each="e : ${related.fromSameYear()}"
           class="tile" th:classappend="'tile--' + ${#strings.toLowerCase(e.feedType())}"
           th:href="@{'/event/' + ${e.id()}}">
            <div class="tile__media">
                <img th:if="${e.thumbnailUrl() != null}" th:src="${e.thumbnailUrl()}" th:alt="${e.title()}" loading="lazy"/>
                <span class="tile__badge" th:if="${e.year() != null}" th:text="${e.year()}">1969</span>
            </div>
            <div class="tile__body">
                <p class="tile__text" th:text="${e.text()}">Something happened.</p>
            </div>
        </a>
    </div>
</section>

<!-- Related by theme -->
<section class="related" th:if="${!related.byTheme().isEmpty()}">
    <h2 class="related__title">Related events</h2>
    <div class="grid grid--related">
        <a th:each="e : ${related.byTheme()}"
           class="tile" th:classappend="'tile--' + ${#strings.toLowerCase(e.feedType())}"
           th:href="@{'/event/' + ${e.id()}}">
            <div class="tile__media">
                <img th:if="${e.thumbnailUrl() != null}" th:src="${e.thumbnailUrl()}" th:alt="${e.title()}" loading="lazy"/>
                <span class="tile__badge" th:if="${e.year() != null}" th:text="${e.year()}">1969</span>
            </div>
            <div class="tile__body">
                <p class="tile__text" th:text="${e.text()}">Something happened.</p>
            </div>
        </a>
    </div>
</section>

<footer class="footer">
    <p>Data from the <a href="https://api.wikimedia.org/wiki/Feed_API/Reference/On_this_day" target="_blank" rel="noopener">Wikimedia On This Day API</a>. A Spring Boot portfolio project.</p>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
