spring:
  application:
    name: on-this-day

  # Default (local/dev) datasource: file-backed H2 so fetched history survives restarts.
  datasource:
    url: jdbc:h2:file:./data/onthisday;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    cache-names: digestToday, digestByDay, eventById, relatedEvents, dayTags

# App-specific settings
onthisday:
  # Cron for the daily fetch job (default 06:00 server time). See ScheduledFetchJob.
  fetch:
    cron: "0 0 6 * * *"
    # On startup, if today's data is missing, fetch it once (handy for demos).
    on-startup: true
  # How many events count as the curated "top picks" for a day.
  digest:
    top-size: 30
  # Optional dev seed used only when the live API is unreachable (see DevDataSeeder).
  seed:
    enabled: false

wikipedia:
  api:
    # Wikimedia REST API root. Feed paths are appended by the client.
    #
    # Two interchangeable public endpoints expose the same "On This Day" data. Switch
    # between them by changing base-url + path-template together (no code change):
    #
    #  1. api.wikimedia.org (default; the modern Wikimedia Enterprise-style API):
    #       base-url:      https://api.wikimedia.org
    #       path-template: /feed/v1/wikipedia/en/onthisday/{type}/{month}/{day}
    #
    #  2. en.wikipedia.org REST v1 (the classic, always-unauthenticated feed):
    #       base-url:      https://en.wikipedia.org
    #       path-template: /api/rest_v1/feed/onthisday/{type}/{month}/{day}
    #
    # If option 1 ever returns 401/403 for your network, switch to option 2.
    base-url: https://api.wikimedia.org
    path-template: /feed/v1/wikipedia/en/onthisday/{type}/{month}/{day}
    # A descriptive User-Agent is requested by Wikimedia so they can reach the operator.
    # See https://api.wikimedia.org/wiki/Documentation
    user-agent: "OnThisDay/0.1 (portfolio project; https://github.com/nttminh/on-this-day)"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.portfolio.onthisday: INFO
